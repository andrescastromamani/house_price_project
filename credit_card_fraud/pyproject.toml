[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "credit_card_fraud"
version = "0.0.1"
description = "Credit_card_fraud_detection"
authors = [
  { name = "Grupo 1" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.20"


[tool.ruff]
line-length = 99
src = ["credit_card_fraud"]
include = ["pyproject.toml", "credit_card_fraud/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["credit_card_fraud"]
force-sort-within-sections = true

